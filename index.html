<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CET · CDInnov — Compte Épargne-Temps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#f7f8fa;
    --panel-2:#f2f4f7;
    --line:#e9ebef;
    --line-strong:#dde1e7;
    --ink:#1a1c24;
    --muted:#6b7280;
    --muted-2:#9aa1ab;
    --accent:#1786c9;        /* cyan-blue cdinnov */
    --accent-strong:#1369a3;
    --accent-soft:#e9f4fc;
    --navy:#1e2a6e;          /* deep navy cdinnov */
    --ok:#2e6f56;
    --ok-soft:#e7f3ee;
    --warn:#b23a48;
    --warn-soft:#fbeaec;
    --pending:#8a6d12;
    --pending-soft:#fbf3dc;
    --radius:14px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.05);
    --shadow-lg:0 12px 40px rgba(16,24,40,.16);
    --font:'Aptos','Segoe UI',-apple-system,BlinkMacSystemFont,system-ui,Roboto,Helvetica,Arial,sans-serif;
    --font-head:'Poppins','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--font);
    color:var(--ink);
    background:var(--bg);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex;min-height:100vh}
  h1,h2,h3,.topbar h1,.card-head h2,.modal-head h3,.section-title,.brand-sub,.stat .v{font-family:var(--font-head)}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:248px;flex:0 0 248px;
    background:var(--panel);
    border-right:1px solid var(--line);
    padding:18px 14px;
    display:flex;flex-direction:column;gap:6px;
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;flex-direction:column;gap:9px;padding:4px 8px 16px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  .brand .brand-logo{width:150px;height:auto;display:block}
  .brand .brand-sub{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.7px;text-transform:uppercase}
  .nav-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted-2);padding:10px 10px 4px}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:9px 11px;border-radius:var(--radius-sm);
    color:var(--ink);cursor:pointer;font-weight:500;
    transition:background .12s ease,color .12s ease;
    user-select:none;
  }
  .nav-item svg{width:18px;height:18px;stroke:var(--muted);flex:0 0 18px;transition:stroke .12s}
  .nav-item:hover{background:var(--panel-2)}
  .nav-item.active{background:#fff;color:var(--accent-strong);box-shadow:var(--shadow);font-weight:600}
  .nav-item.active svg{stroke:var(--accent)}
  .sidebar .spacer{flex:1}
  .sidebar .foot{font-size:11px;color:var(--muted-2);padding:8px 10px;border-top:1px solid var(--line)}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:flex;align-items:center;gap:16px;
    padding:20px 30px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);z-index:5;
  }
  .topbar h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.2px}
  .topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .topbar .grow{flex:1}
  .year-pick{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 14px}
  .year-pick label{font-size:12px;color:var(--muted);font-weight:600}
  .year-pick select{border:none;background:#fff;border-radius:999px;padding:5px 10px;font-weight:600;color:var(--navy);font-family:var(--font);cursor:pointer}
  .content{padding:26px 30px 60px;max-width:1180px;width:100%}
  .sync-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none;transition:all .12s}
  .sync-pill:hover{border-color:var(--muted-2)}
  .sync-pill .sdot{width:7px;height:7px;border-radius:50%;background:var(--muted-2)}
  .sync-pill[data-state="ok"]{color:var(--ok);background:var(--ok-soft);border-color:#cfe6da}
  .sync-pill[data-state="ok"] .sdot{background:var(--ok)}
  .sync-pill[data-state="busy"]{color:var(--accent-strong);background:var(--accent-soft);border-color:#cfe6f7}
  .sync-pill[data-state="busy"] .sdot{background:var(--accent);animation:pulse 1s infinite}
  .sync-pill[data-state="err"]{color:var(--warn);background:var(--warn-soft);border-color:#eccfd3}
  .sync-pill[data-state="err"] .sdot{background:var(--warn)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---------- Buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    border:1px solid transparent;border-radius:999px;
    padding:9px 16px;font-size:13px;font-weight:600;font-family:var(--font);
    cursor:pointer;transition:all .13s ease;white-space:nowrap;
  }
  .btn svg{width:16px;height:16px}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:var(--accent-strong)}
  .btn-ghost{background:#fff;color:var(--ink);border-color:var(--line-strong)}
  .btn-ghost:hover{background:var(--panel);border-color:var(--muted-2)}
  .btn-subtle{background:var(--panel-2);color:var(--ink)}
  .btn-subtle:hover{background:#e7eaef}
  .btn-danger{background:#fff;color:var(--warn);border-color:#eccfd3}
  .btn-danger:hover{background:var(--warn-soft)}
  .btn-sm{padding:6px 12px;font-size:12px}
  .icon-btn{width:32px;height:32px;padding:0;border-radius:8px;background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .12s}
  .icon-btn:hover{background:var(--panel-2);color:var(--ink)}
  .icon-btn svg{width:16px;height:16px}

  /* ---------- Cards / stats ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:7px}
  .stat .k svg{width:15px;height:15px;stroke:var(--accent)}
  .stat .v{font-size:26px;font-weight:700;margin-top:8px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .stat .v .u{font-size:13px;font-weight:600;color:var(--muted-2);margin-left:4px}
  .stat .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .stat.accent{background:linear-gradient(160deg,#fff, #f4faff);border-color:#d7ebf9}

  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden}
  .card-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .card-head h2{font-size:15px;margin:0;font-weight:700}
  .card-head .desc{font-size:12px;color:var(--muted)}
  .card-head .grow{flex:1}
  .card-body{padding:6px 8px}
  .card-pad{padding:20px}

  /* ---------- Table ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{
    text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;
    color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.clickable{cursor:pointer;transition:background .1s}
  tbody tr.clickable:hover{background:var(--panel)}
  th.th-sort{cursor:pointer;user-select:none;white-space:nowrap;transition:color .12s}
  th.th-sort:hover{color:var(--ink)}
  th.th-sort.act{color:var(--accent-strong)}
  th.th-sort .car{font-size:10px;margin-left:4px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .name-cell{display:flex;align-items:center;gap:10px}
  .avatar{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 30px}
  .name-cell .t{font-weight:600}
  .name-cell .s{font-size:11px;color:var(--muted)}
  .empty{padding:40px 20px;text-align:center;color:var(--muted)}
  .empty svg{width:34px;height:34px;stroke:var(--muted-2);margin-bottom:8px}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .badge .dot{width:6px;height:6px;border-radius:50%}
  .b-ok{background:var(--panel-2);color:var(--muted)}
  .b-ok .dot{background:var(--muted-2)}
  .b-warn{background:var(--warn-soft);color:var(--warn)}
  .b-warn .dot{background:var(--warn)}
  .b-pending{background:var(--pending-soft);color:var(--pending)}
  .b-pending .dot{background:var(--pending)}
  .b-valid{background:var(--accent-soft);color:var(--accent-strong)}
  .b-valid .dot{background:var(--accent)}
  .b-alim{background:var(--accent-soft);color:var(--accent-strong)}
  .b-util{background:#eef0f4;color:#475065}
  .b-green{background:var(--ok-soft);color:var(--ok)} .b-green .dot{background:var(--ok)}
  .b-red{background:var(--warn-soft);color:var(--warn)} .b-red .dot{background:var(--warn)}
  .chip{display:inline-block;font-size:11px;color:var(--muted);background:var(--panel-2);padding:2px 8px;border-radius:6px;font-weight:600}

  /* gauge */
  .gauge{height:7px;background:var(--panel-2);border-radius:999px;overflow:hidden;margin-top:9px}
  .gauge > i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s ease}
  .gauge.over > i{background:var(--warn)}

  /* ---------- Filters ---------- */
  .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .field{position:relative}
  select.inp,input.inp,textarea.inp{
    font-family:var(--font);font-size:13px;color:var(--ink);
    border:1px solid var(--line-strong);border-radius:var(--radius-sm);
    padding:9px 12px;background:#fff;width:100%;transition:border .12s,box-shadow .12s;
  }
  select.inp{cursor:pointer;padding-right:30px;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 10px center}
  .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .inp.slim{padding:7px 11px}
  .search{position:relative}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted-2)}
  .search input{padding-left:32px;min-width:210px}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,22,30,.42);backdrop-filter:blur(2px);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:48px 16px;overflow:auto}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;animation:pop .18s ease}
  .modal.wide{max-width:880px}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
  .modal-head{display:flex;align-items:center;padding:20px 24px 6px}
  .modal-head h3{margin:0;font-size:17px;font-weight:700}
  .modal-head .grow{flex:1}
  .modal-body{padding:14px 24px 4px}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:18px 24px 22px;border-top:1px solid var(--line);margin-top:14px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form-row{display:flex;flex-direction:column;gap:6px}
  .form-row.full{grid-column:1 / -1}
  .form-row label{font-size:12px;font-weight:600;color:var(--muted)}
  .hint{font-size:11px;color:var(--muted-2)}
  .preview{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
  .preview b{color:var(--ink)}

  /* employee detail */
  .detail-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .detail-stats .s{background:var(--panel);border-radius:var(--radius-sm);padding:12px 14px}
  .detail-stats .s .k{font-size:11px;color:var(--muted);font-weight:600}
  .detail-stats .s .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}

  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transition:all .25s ease;z-index:80;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .section-title{font-size:13px;font-weight:700;color:var(--navy);margin:22px 2px 10px;text-transform:uppercase;letter-spacing:.5px}
  .help-banner{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border:1px solid #d2e8f8;border-radius:var(--radius);padding:14px 16px;font-size:12.5px;color:#2d4a63;margin-bottom:20px}
  .help-banner svg{width:18px;height:18px;stroke:var(--accent-strong);flex:0 0 18px;margin-top:1px}
  a.link{color:var(--accent-strong);font-weight:600;text-decoration:none;cursor:pointer}
  a.link:hover{text-decoration:underline}

  @media (max-width:880px){
    .sidebar{display:none}
    .form-grid,.detail-stats{grid-template-columns:1fr 1fr}
    .content{padding:18px}
    .topbar{padding:16px 18px}
  }
  @media print{
    .sidebar,.topbar .year-pick,.no-print{display:none!important}
    .main{display:block}
  }
</style>
</head>

const STORE_KEY = 'cet_cdinnov_v1';

/* ---------- state / persistence ---------- */
let state = load();

function freshState(){
  return {
    params: structuredClone(PARAMS_DEFAULT),
    types: structuredClone(TYPES_DEFAULT),
    salaries: structuredClone(SALARIES_DEFAULT),
    mouvements: structuredClone(MOUVEMENTS_DEFAULT)
  };
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return freshState();
    const d = JSON.parse(raw);
    return {
      params: Object.assign(structuredClone(PARAMS_DEFAULT), d.params||{}),
      types: d.types && d.types.length ? d.types : structuredClone(TYPES_DEFAULT),
      salaries: d.salaries || [],
      mouvements: d.mouvements || []
    };
  }catch(e){ STORAGE_OK=false; return freshState(); }
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); STORAGE_OK=true; }catch(e){ STORAGE_OK=false; } cloudSave(); }

/* ===================== SYNCHRO CLOUDFLARE ===================== */
let cloudTimer=null;
function cloudEnabled(){ return typeof CLOUD_ENDPOINT==='string' && CLOUD_ENDPOINT.trim()!==''; }
function cloudURL(){ return CLOUD_ENDPOINT.replace(/\/+$/,'')+'/'+encodeURIComponent(CLOUD_TOKEN); }
function setSync(kind,txt){ const p=$('#syncPill'); if(!p) return; p.dataset.state=kind; const t=$('#syncTxt'); if(t) t.textContent=txt; }
async function cloudLoad(){
  if(!cloudEnabled()){ setSync('local','Local'); return; }
  setSync('busy','Chargement…');
  try{
    const r=await fetch(cloudURL(),{method:'GET',cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const txt=await r.text();
    if(txt && txt.trim()){
      const d=JSON.parse(txt);
      if(d && d.params){
        state={ params:Object.assign(structuredClone(PARAMS_DEFAULT), d.params),
                types:(d.types&&d.types.length)?d.types:structuredClone(TYPES_DEFAULT),
                salaries:d.salaries||[], mouvements:d.mouvements||[] };
        try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
        currentYear=Number(state.params.anneeSuivi)||currentYear;
      }
      setSync('ok','Synchronisé'); render();
    } else {
      await cloudPush(); render();   // aucune donnee distante : on envoie l'etat local
    }
  }catch(e){ setSync('err','Hors ligne'); }
}
function cloudSave(){ if(!cloudEnabled()) return; clearTimeout(cloudTimer); cloudTimer=setTimeout(cloudPush, 700); }
async function cloudPush(){
  if(!cloudEnabled()) return;
  setSync('busy','Envoi…');
  try{
    const r=await fetch(cloudURL(),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    setSync('ok','Synchronisé');
  }catch(e){ setSync('err','Erreur sync'); }
}
function cloudSyncNow(){ if(cloudEnabled()) cloudLoad(); else toast('Renseignez CLOUD_ENDPOINT en haut du fichier'); }

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=> 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const yearOf = d => d ? Number(String(d).slice(0,4)) : null;
function nbJours(n){ if(n==null||n==='') return '—'; return Number(n).toLocaleString('fr-FR',{maximumFractionDigits:2}); }
function eur(n){ if(n==null||n==='') return '—'; return Number(n).toLocaleString('fr-FR',{maximumFractionDigits:0})+' €'; }
function dateFR(d){ if(!d) return '—'; const [y,m,da]=String(d).split('-'); return `${da}/${m}/${y}`; }
function initials(s){ return (s.nom?.[0]||'')+(s.prenom?.[0]||''); }
function typeByCode(c){ return state.types.find(t=>t.code===c); }
function salByMat(m){ return state.salaries.find(s=>s.matricule===m); }
/* vert = alimentation ou affectation epargne (PEI/PERECOLI) ; rouge = utilisation */
function movTone(m){ return (m.categorie==='Alimentation' || m.type==='UTIL_PEI' || m.type==='UTIL_PERECOLI') ? 'green' : 'red'; }

/* ---------- CET engine ---------- */
function enrich(m){
  const t = typeByCode(m.type) || {signe:0,categorie:'',compteCP:'Non',epargne:'Non',monetisation:'Non',libelle:m.type};
  const sal = salByMat(m.matricule);
  const qte = Number(m.qte)||0;
  const signe = Number(t.signe)||0;
  const qteSignee = qte*signe;
  const cout = (sal && sal.coutJour!=null && sal.coutJour!=='') ? Number(sal.coutJour) : null;
  const montant = cout!=null ? qteSignee*cout : null;
  return {...m, t, sal, qte, signe, qteSignee, cout, montant,
          annee:yearOf(m.date), categorie:t.categorie, cp:t.compteCP, epargne:t.epargne, libelle:t.libelle};
}
function allEnriched(){ return state.mouvements.map(enrich); }

function computeYear(Y){
  Y = Number(Y);
  const valid = allEnriched().filter(m=>m.statut==='Validé');
  const rows = state.salaries.map(sal=>{
    const ms = valid.filter(m=>m.matricule===sal.matricule);
    const soldeDebut = ms.filter(m=> yearOf(m.date) < Y).reduce((a,m)=>a+m.qteSignee,0);
    const inY = ms.filter(m=>m.annee===Y);
    const credits = inY.filter(m=>m.qteSignee>0).reduce((a,m)=>a+m.qteSignee,0);
    const debits  = inY.filter(m=>m.qteSignee<0).reduce((a,m)=>a+m.qteSignee,0);
    const soldeFin = soldeDebut+credits+debits;
    const cpAffectes = inY.filter(m=>m.cp==='Oui' && m.qteSignee>0).reduce((a,m)=>a+m.qte,0);
    const cout = (sal.coutJour!=null && sal.coutJour!=='') ? Number(sal.coutJour) : null;
    const peiJ = inY.filter(m=>m.type==='UTIL_PEI').reduce((a,m)=>a+m.qte,0);
    const perJ = inY.filter(m=>m.type==='UTIL_PERECOLI').reduce((a,m)=>a+m.qte,0);
    return {
      sal, soldeDebut, credits, debits, soldeFin, cpAffectes,
      alerteCP: cpAffectes > Number(state.params.plafondCPan),
      alertePlafond: soldeFin > Number(state.params.plafondGlobal),
      montant: cout!=null ? soldeFin*cout : null,
      peiJ, peiE: cout!=null ? peiJ*cout : null,
      perJ, perE: cout!=null ? perJ*cout : null
    };
  });
  return rows;
}
function globalTotals(rows){
  return {
    soldeFin: rows.reduce((a,r)=>a+r.soldeFin,0),
    credits: rows.reduce((a,r)=>a+r.credits,0),
    debits: rows.reduce((a,r)=>a+r.debits,0),
    epargne: rows.reduce((a,r)=>a+r.peiJ+r.perJ,0),
    montant: rows.reduce((a,r)=>a+(r.montant||0),0),
    alertesCP: rows.filter(r=>r.alerteCP).length,
    alertesPlafond: rows.filter(r=>r.alertePlafond).length
  };
}
function availableYears(){
  const ys = new Set(state.mouvements.map(m=>yearOf(m.date)).filter(Boolean));
  ys.add(Number(state.params.anneeSuivi));
  ys.add(new Date().getFullYear());
  return [...ys].sort((a,b)=>b-a);
}

function render(){

function injectStorageWarning(){

  const c=$('#content'); if(!c || c.querySelector('#storageWarn')) return;
  const div=document.createElement('div');
  div.id='storageWarn'; div.className='help-banner';
  div.style.cssText='background:var(--pending-soft);border-color:#ecdca6;color:#6b520b';
  div.innerHTML=`${ic('alert')}<div><b>Stockage local indisponible dans ce mode d'ouverture.</b> Vos saisies fonctionnent normalement mais ne seront pas conservees a la fermeture. Ouvrez le fichier par double-clic depuis l'explorateur, et utilisez <b>Sauvegarde / Importer (JSON)</b> dans Parametres pour conserver vos donnees.</div>`;
  c.prepend(div);
}

/* ---------- Dashboard ---------- */

  const g=globalTotals(rows);

    <div class="card">

          const pct=Math.min(100, pg? r.soldeFin/pg*100:0);
          return `<div style="margin-bottom:15px">
            <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:2px">
              <span><b>${esc(r.sal.nom)} ${esc(r.sal.prenom)}</b></span>

            <div class="gauge ${r.alertePlafond?'over':''}"><i style="width:${pct}%"></i></div></div>`;
        }).join('') : `<div style="color:var(--muted);font-size:13px">Aucun solde positif sur ${currentYear}.</div>`}
      </div>
    </div>
  `;
}
function stateBadges(r){

/* ---------- Mouvements ---------- */
let movFilter={sal:'',type:'',cat:'',q:''};
let movSort={key:'date',dir:'desc'};
function setSort(key){ if(movSort.key===key) movSort.dir=movSort.dir==='asc'?'desc':'asc'; else { movSort.key=key; movSort.dir=(key==='date'||key==='qte'||key==='montant')?'desc':'asc'; } renderMouvements(); }
function sortArrow(key){ if(movSort.key!==key) return '<span class="car" style="opacity:.28">↕</span>'; return '<span class="car">'+(movSort.dir==='asc'?'▲':'▼')+'</span>'; }
function sortMovs(list){ const k=movSort.key, s=movSort.dir==='asc'?1:-1; const val=m=>{ switch(k){ case 'sal': return m.sal?(m.sal.nom+' '+m.sal.prenom):'zzz'; case 'type': return m.libelle||m.type||''; case 'qte': return m.qteSignee; case 'statut': return m.statut||''; case 'montant': return m.montant==null?-Infinity:m.montant; default: return m.date||''; } }; return list.sort((a,b)=>{ let va=val(a),vb=val(b); if(typeof va==='number'&&typeof vb==='number') return (va-vb)*s; va=String(va).toLowerCase(); vb=String(vb).toLowerCase(); return (va<vb?-1:va>vb?1:0)*s; }); }
function renderMouvements(){

        </div>
        <div class="grow"></div>

        <button class="btn btn-ghost btn-sm no-print" onclick="exportMouvCSV()">${ic('download')} Export</button>

            <th></th>
          </tr></thead>
          <tbody>
          ${list.map(m=>`
            <tr>
              <td style="white-space:nowrap">${dateFR(m.date)}</td>
              <td><div class="name-cell"><div class="avatar">${m.sal?esc(initials(m.sal)):'?'}</div>
                <div><div class="t">${m.sal?esc(m.sal.nom+' '+m.sal.prenom):'<i>inconnu</i>'}</div><div class="s">Mat. ${esc(m.matricule)}</div></div></div></td>
              <td><span class="badge ${movTone(m)==='green'?'b-green':'b-red'}"><span class="dot"></span>${esc(m.libelle)}</span></td>
              <td class="num" style="color:${movTone(m)==='green'?'var(--ok)':'var(--warn)'};font-weight:600">${m.qteSignee>0?'+':''}${nbJours(m.qteSignee)} j</td>
              <td>${statutBadge(m.statut)}</td>

              <td class="num" style="white-space:nowrap">
                <button class="icon-btn" title="Modifier" onclick="openMouvement('${m.id}')">${ic('edit')}</button>
                <button class="icon-btn" title="Supprimer" onclick="delMouvement('${m.id}')">${ic('trash')}</button>
              </td>
            </tr>`).join('')}
          </tbody>
        </table>

      </div>
    </div>`;
  $('#fq').addEventListener('input', e=>{movFilter.q=e.target.value; renderMouvements(); setTimeout(()=>{const el=$('#fq'); el.focus(); el.setSelectionRange(el.value.length,el.value.length);},0);});

function modal(html,wide){
  const o=$('#overlay');
  o.innerHTML=`<div class="modal ${wide?'wide':''}">${html}</div>`;

  o.onclick=e=>{ if(e.target===o) closeModal(); };
}
function closeModal(){ $('#overlay').classList.remove('show'); $('#overlay').innerHTML=''; }

/* --- Mouvement form --- */
function openMouvement(id){
  const m = id ? state.mouvements.find(x=>x.id===id) : null;
  const today=new Date().toISOString().slice(0,10);
  modal(`
    <div class="modal-head"><h3>${m?'Modifier le mouvement':'Nouveau mouvement'}</h3></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-row"><label>Date</label><input class="inp" type="date" id="mDate" value="${m?m.date:today}"></div>
        <div class="form-row"><label>Salarié</label><select class="inp" id="mSal">${state.salaries.map(s=>`<option value="${s.matricule}" ${m&&m.matricule===s.matricule?'selected':''}>${esc(s.nom)} ${esc(s.prenom)} (${s.matricule})</option>`).join('')}</select></div>
        <div class="form-row full"><label>Type de mouvement</label><select class="inp" id="mType">${state.types.map(t=>`<option value="${t.code}" ${m&&m.type===t.code?'selected':''}>${esc(t.libelle)}</option>`).join('')}</select></div>
        <div class="form-row"><label>Quantité (jours, positive)</label><input class="inp" type="number" min="0" step="0.5" id="mQte" value="${m?m.qte:''}" placeholder="ex. 5"></div>
        <div class="form-row"><label>Statut</label><select class="inp" id="mStatut"><option ${m&&m.statut==='Validé'?'selected':''}>Validé</option><option ${m&&m.statut==='En attente'?'selected':''}>En attente</option></select></div>
        <div class="form-row full"><label>Commentaire</label><input class="inp" id="mComm" value="${m?esc(m.commentaire||''):''}" placeholder="optionnel"></div>
        <div class="form-row full"><div class="preview" id="mPreview"></div></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveMouvement('${m?m.id:''}')">${ic('check')} ${m?'Enregistrer':'Ajouter'}</button>
    </div>`);
  const upd=()=>{
    const t=typeByCode($('#mType').value); const q=Number($('#mQte').value)||0;
    const sal=salByMat($('#mSal').value);
    const signed=q*(t?t.signe:0);
    const cout=sal&&sal.coutJour?Number(sal.coutJour):null;
    $('#mPreview').innerHTML = t? `${ic('info')}
      <span>Catégorie <b>${esc(t.categorie)}</b></span><span>·</span>
      <span>Effet sur le solde <b style="color:${signed>=0?'var(--accent-strong)':'var(--warn)'}">${signed>0?'+':''}${nbJours(signed)} j</b></span><span>·</span>
      <span>Compteur CP <b>${t.compteCP}</b></span><span>·</span>
      <span>Épargne <b>${t.epargne}</b></span>${cout!=null?`<span>·</span><span>Montant <b>${eur(Math.abs(signed)*cout*(signed<0?-1:1))}</b></span>`:''}` : '';
  };
  ['#mType','#mQte','#mSal'].forEach(s=>$(s).addEventListener('input',upd));
  upd();
}
function saveMouvement(id){
  const date=$('#mDate').value, mat=$('#mSal').value, type=$('#mType').value;
  const qte=Number($('#mQte').value), statut=$('#mStatut').value, comm=$('#mComm').value.trim();
  if(!date||!mat||!type){ toast('Date, salarié et type sont requis'); return; }
  if(!(qte>0)){ toast('Saisissez une quantité positive'); return; }
  if(id){ const m=state.mouvements.find(x=>x.id===id); Object.assign(m,{date,matricule:mat,type,qte,statut,commentaire:comm}); }
  else { state.mouvements.push({id:uid(),date,matricule:mat,type,qte,statut,commentaire:comm}); movSort={key:'date',dir:'desc'}; }
  save(); closeModal(); toast(id?'Mouvement modifié':'Mouvement ajouté'); render();
}
function delMouvement(id){
  confirmModal('Supprimer ce mouvement ?','Cette écriture sera retirée du calcul des soldes.',()=>{
    state.mouvements=state.mouvements.filter(m=>m.id!==id); save(); closeModal(); toast('Mouvement supprimé'); render();
  });
}

function saveSalarie(mat){
  const isNew=!mat;
  const matricule = isNew ? $('#sMat').value.trim() : mat;
  const nom=$('#sNom').value.trim(), prenom=$('#sPrenom').value.trim();
  if(!matricule){ toast('Matricule requis'); return; }
  if(!nom){ toast('Nom requis'); return; }
  if(isNew && salByMat(matricule)){ toast('Ce matricule existe déjà'); return; }
  const data={matricule, nom, prenom, dateEntree:$('#sDate').value,
    tempsPartiel:Number($('#sTps').value)||100, statut:$('#sStatut').value,
    coutJour: $('#sCout').value===''?null:Number($('#sCout').value), commentaire:$('#sComm').value.trim()};
  if(isNew) state.salaries.push(data);
  else Object.assign(salByMat(mat), data);
  save(); closeModal(); toast(isNew?'Salarié ajouté':'Salarié modifié'); render();
}
function delSalarie(mat){
  const n=state.mouvements.filter(m=>m.matricule===mat).length;
  confirmModal('Supprimer ce salarié ?', n?`Attention : ${n} mouvement(s) lui sont rattachés et seront aussi supprimés.`:'Aucun mouvement rattaché.',()=>{
    state.salaries=state.salaries.filter(s=>s.matricule!==mat);
    state.mouvements=state.mouvements.filter(m=>m.matricule!==mat);
    save(); closeModal(); toast('Salarié supprimé'); render();
  });
}

        <div class="form-row"><label>Catégorie</label><select class="inp" id="tCat"><option ${t&&t.categorie==='Alimentation'?'selected':''}>Alimentation</option><option ${t&&t.categorie==='Utilisation'?'selected':''}>Utilisation</option></select></div>
        <div class="form-row full"><label>Libellé</label><input class="inp" id="tLib" value="${t?esc(t.libelle):''}"></div>
        <div class="form-row"><label>Effet sur le solde</label><select class="inp" id="tSigne"><option value="1" ${t&&t.signe>0?'selected':''}>+ Crédit (alimente)</option><option value="-1" ${t&&t.signe<0?'selected':''}>− Débit (utilise)</option></select></div>
        <div class="form-row"><label>Compteur CP→CET ?</label><select class="inp" id="tCp"><option ${t&&t.compteCP==='Oui'?'selected':''}>Non</option><option ${t&&t.compteCP==='Oui'?'selected':''} value="Oui">Oui</option></select></div>
        <div class="form-row"><label>Compte épargne ?</label><select class="inp" id="tEp"><option value="Non" ${!t||t.epargne!=='Oui'?'selected':''}>Non</option><option value="Oui" ${t&&t.epargne==='Oui'?'selected':''}>Oui</option></select></div>
        <div class="form-row"><label>Monétisable ?</label><select class="inp" id="tMon"><option value="Non" ${!t||t.monetisation!=='Oui'?'selected':''}>Non</option><option value="Oui" ${t&&t.monetisation==='Oui'?'selected':''}>Oui</option></select></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveType('${t?t.code:''}')">${ic('check')} ${t?'Enregistrer':'Ajouter'}</button>
    </div>`);
  // fix CP select default
  const cp=$('#tCp'); cp.innerHTML=`<option value="Non" ${!t||t.compteCP!=='Oui'?'selected':''}>Non</option><option value="Oui" ${t&&t.compteCP==='Oui'?'selected':''}>Oui</option>`;
}
function saveType(code){
  const isNew=!code;
  const c = isNew ? $('#tCode').value.trim().toUpperCase() : code;
  if(!c){ toast('Code requis'); return; }
  if(isNew && typeByCode(c)){ toast('Ce code existe déjà'); return; }
  const data={code:c, libelle:$('#tLib').value.trim()||c, categorie:$('#tCat').value,
    signe:Number($('#tSigne').value), compteCP:$('#tCp').value, epargne:$('#tEp').value, monetisation:$('#tMon').value};
  if(isNew) state.types.push(data); else Object.assign(typeByCode(code),data);
  save(); closeModal(); toast(isNew?'Type ajouté':'Type modifié'); render();
}
function delType(code){
  const n=state.mouvements.filter(m=>m.type===code).length;
  if(n){ toast(`Impossible : ${n} mouvement(s) utilisent ce type`); return; }
  confirmModal('Supprimer ce type ?','',()=>{ state.types=state.types.filter(t=>t.code!==code); save(); closeModal(); toast('Type supprimé'); render(); });
}

/* --- Detail employee --- */
function openDetail(mat){
  const s=salByMat(mat); if(!s) return;
  const r=computeYear(currentYear).find(x=>x.sal.matricule===mat);
  const hist=allEnriched().filter(m=>m.matricule===mat).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let run=0; const histRows=hist.map(m=>{ if(m.statut==='Validé') run+=m.qteSignee; return {m,run};}).reverse();
  modal(`
    <div class="modal-head">
      <div class="name-cell"><div class="avatar" style="width:38px;height:38px;font-size:14px">${esc(initials(s))}</div>
        <div><h3 style="margin:0">${esc(s.nom)} ${esc(s.prenom)}</h3><div class="s" style="color:var(--muted);font-size:12px">Matricule ${esc(s.matricule)} · entré le ${dateFR(s.dateEntree)} · ${s.statut}</div></div></div>
      <div class="grow"></div>
      <button class="icon-btn" onclick="closeModal()">${ic('close')}</button>
    </div>
    <div class="modal-body">
      <div class="detail-stats">
        <div class="s"><div class="k">Solde fin ${currentYear}</div><div class="v">${nbJours(r.soldeFin)} <span style="font-size:12px;color:var(--muted)">j</span></div></div>
        <div class="s"><div class="k">Crédits</div><div class="v" style="color:var(--accent-strong)">+${nbJours(r.credits)}</div></div>
        <div class="s"><div class="k">Débits</div><div class="v">${nbJours(r.debits)}</div></div>
        <div class="s"><div class="k">CP affectés</div><div class="v">${nbJours(r.cpAffectes)}<span style="font-size:12px;color:var(--muted)"> / ${state.params.plafondCPan}</span></div></div>
      </div>
      ${(r.alerteCP||r.alertePlafond)?`<div class="help-banner" style="background:var(--warn-soft);border-color:#eccfd3;color:#7a2530">${ic('alert')}<div>${r.alerteCP?`Plafond CP→CET dépassé (${nbJours(r.cpAffectes)} j &gt; ${state.params.plafondCPan} j). `:''}${r.alertePlafond?`Solde au-delà du plafond global (${nbJours(r.soldeFin)} j &gt; ${state.params.plafondGlobal} j).`:''}</div></div>`:''}
      <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:12.5px;color:var(--muted)">
        <span>${ic('bank')} PEI : <b style="color:var(--ink)">${nbJours(r.peiJ)} j</b> ${r.peiE!=null?`(${eur(r.peiE)})`:''}</span>
        <span>${ic('bank')} PERECOLI : <b style="color:var(--ink)">${nbJours(r.perJ)} j</b> ${r.perE!=null?`(${eur(r.perE)})`:''}</span>
        <span>Valorisation solde : <b style="color:var(--ink)">${eur(r.montant)}</b></span>
      </div>
      <div class="section-title" style="margin-top:6px">Historique du compte</div>
      <div style="max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm)">
        <table>
          <thead><tr><th>Date</th><th>Type</th><th class="num">Mouvement</th><th class="num">Solde cumulé</th><th>Statut</th></tr></thead>
          <tbody>
          ${histRows.length?histRows.map(({m,run})=>`
            <tr>
              <td style="white-space:nowrap">${dateFR(m.date)}</td>
              <td><span class="badge ${movTone(m)==='green'?'b-green':'b-red'}"><span class="dot"></span>${esc(m.libelle)}</span></td>
              <td class="num" style="color:${movTone(m)==='green'?'var(--ok)':'var(--warn)'};font-weight:600">${m.qteSignee>0?'+':''}${nbJours(m.qteSignee)} j</td>
              <td class="num">${m.statut==='Validé'?'<b>'+nbJours(run)+'</b>':'<span style="color:var(--muted-2)">—</span>'}</td>
              <td>${statutBadge(m.statut)}</td>
            </tr>`).join(''):`<tr><td colspan="5" class="empty">Aucun mouvement.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Fermer</button>
      <button class="btn btn-primary" onclick="closeModal();openMouvement()">${ic('plus')} Mouvement pour ce salarié</button>
    </div>`, true);
}

/* --- confirm --- */
function confirmModal(title,msg,onYes){
  modal(`
    <div class="modal-head"><h3>${esc(title)}</h3></div>
    <div class="modal-body"><p style="color:var(--muted);margin:6px 0 4px">${esc(msg)}</p></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-danger" id="cYes">${ic('trash')} Confirmer</button>
    </div>`);
  $('#cYes').onclick=onYes;
}

/* ===================== EXPORT / IMPORT ===================== */
function dl(name,content,mime){
  const blob=new Blob([content],{type:mime}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);
}
function csvCell(v){ if(v==null) v=''; v=String(v).replace(/"/g,'""'); return `"${v}"`; }
function exportCSV(){
  const rows=computeYear(currentYear);
  const head=['Matricule','Nom','Prénom','Solde début','Crédits année','Débits année','Solde fin','CP affectés','Alerte CP','Alerte plafond','Valorisation €','PEI jours','PEI €','PERECOLI jours','PERECOLI €'];
  const lines=[head.map(csvCell).join(';')];
  rows.forEach(r=>lines.push([r.sal.matricule,r.sal.nom,r.sal.prenom,r.soldeDebut,r.credits,r.debits,r.soldeFin,r.cpAffectes,
    r.alerteCP?'OUI':'non',r.alertePlafond?'OUI':'non',r.montant==null?'':r.montant,r.peiJ,r.peiE==null?'':r.peiE,r.perJ,r.perE==null?'':r.perE].map(csvCell).join(';')));
  dl(`CET_Synthese_${currentYear}.csv`, '﻿'+lines.join('\r\n'), 'text/csv;charset=utf-8');
  toast('Synthèse exportée');
}
function exportMouvCSV(){
  const head=['Date','Matricule','Nom Prénom','Type','Libellé','Catégorie','Qté','Signe','Qté signée','Montant €','Année','CP?','Épargne?','Statut','Commentaire'];
  const lines=[head.map(csvCell).join(';')];
  allEnriched().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(m=>lines.push([
    m.date, m.matricule, m.sal?m.sal.nom+' '+m.sal.prenom:'', m.type, m.libelle, m.categorie, m.qte, m.signe, m.qteSignee,
    m.montant==null?'':m.montant, m.annee, m.cp, m.epargne, m.statut, m.commentaire||''].map(csvCell).join(';')));
  dl(`CET_Mouvements.csv`, '﻿'+lines.join('\r\n'), 'text/csv;charset=utf-8');
  toast('Mouvements exportés');
}
function backupJSON(){
  dl(`CET_CDInnov_sauvegarde_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(state,null,2), 'application/json');
  toast('Sauvegarde téléchargée');
}
function importJSON(ev){
  const f=ev.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
      const d=JSON.parse(rd.result);
      if(!d.params||!d.salaries) throw 0;
      state={ params:Object.assign(structuredClone(PARAMS_DEFAULT),d.params), types:d.types||structuredClone(TYPES_DEFAULT), salaries:d.salaries||[], mouvements:d.mouvements||[] };
      currentYear=Number(state.params.anneeSuivi); save(); toast('Données importées'); render();
    }catch(e){ toast('Fichier invalide'); } };
  rd.readAsText(f); ev.target.value='';
}
function resetAll(){
  confirmModal('Réinitialiser toutes les données ?','Le contenu actuel sera remplacé par le jeu de données d\'origine (5 salariés). Pensez à sauvegarder avant.',()=>{
    state=freshState(); currentYear=Number(state.params.anneeSuivi); save(); closeModal(); toast('Données réinitialisées'); setView('dashboard');
  });
}

/* ===================== UI atoms ===================== */
function optAll(label){ return `<option value="">${label}</option>`; }
function emptyState(t,d){ return `<div class="empty">${ic('inbox')}<div style="font-weight:600;color:var(--ink)">${esc(t)}</div><div>${esc(d)}</div></div>`; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

function ic(name){
  const p={
    wallet:'<rect x="2" y="6" width="20" height="14" rx="3"/><path d="M2 10h20"/><circle cx="17" cy="14" r="1.4"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    minus:'<path d="M5 12h14"/>',
    bank:'<path d="M3 21h18M5 21V10M19 21V10M3 10l9-6 9 6M9 21v-6h6v6"/>',
    alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/>',
    upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5M12 3v12"/>',
    save:'<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
    print:'<path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/>',
    edit:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
    trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',
    close:'<path d="M18 6 6 18M6 6l12 12"/>',
    info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    refresh:'<path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/>',
    inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.5 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.5A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.5z"/>'
  }[name]||'';
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}

/* ===================== boot ===================== */
setView('dashboard');
if(cloudEnabled()) cloudLoad(); else setSync('local','Local');
</script>
